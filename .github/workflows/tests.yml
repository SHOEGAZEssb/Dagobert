name: Tests

on:
  push:
    branches: ['**']
    # Release tags run these tests through create_release.yml.
    tags-ignore: ['v*']
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev\" -Force

      - name: Run NUnit Tests
        run: dotnet test Dagobert.sln --configuration Release -p:Use_DalamudPackager=false
